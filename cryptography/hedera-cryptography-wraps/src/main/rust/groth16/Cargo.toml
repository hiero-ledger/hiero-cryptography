[package]
name = "ark-groth16"
version = "0.5.0"
authors = [ "arkworks contributors" ]
description = "An implementation of the Groth 2016 zkSNARK proof system"
documentation = "https://docs.rs/ark-groth16/"
keywords = [
    "zero-knowledge",
    "cryptography",
    "zkSNARK",
    "SNARK",
    "Groth-Maller",
]
categories = ["cryptography"]
include = ["Cargo.toml", "src", "README.md", "LICENSE-APACHE", "LICENSE-MIT"]
license = "MIT/Apache-2.0"
edition = "2021"

################################# Dependencies ################################

[dependencies]
ark-ff = { version = "0.5.0", default-features = false }
ark-ec = { version = "0.5.0", default-features = false }
ark-serialize = { version = "0.5.0", default-features = false, features = [ "derive" ] }
ark-poly = { version = "0.5.0", default-features = false }
ark-std = { git = "https://github.com/arkworks-rs/std", rev = "73dcad0", default-features = false }
ark-relations = { version = "0.5.0", default-features = false }
ark-snark = { version = "0.5.0", default-features = false }
ark-r1cs-std = { git = "https://github.com/winderica/r1cs-std", rev = "ae8283a", default-features = false, optional = true }
ark-crypto-primitives = { git = "https://github.com/winderica/crypto-primitives", rev = "af003fc", default-features = false, features = [ "snark", "sponge" ] }

tracing = { version = "0.1", default-features = false, features = ["attributes" ], optional = true }
educe = { version = "0.6.0", default-features = false, features = [ "Clone" ], optional = true }
rayon = { version = "1", optional = true }

[dev-dependencies]
ark-r1cs-std = { git = "https://github.com/winderica/r1cs-std", rev = "ae8283a", default-features = false }


[features]
default = ["parallel"]
std = [
    "ark-ff/std",
    "ark-ec/std",
    "ark-poly/std",
    "ark-relations/std",
    "ark-crypto-primitives/std",
    "ark-std/std",
]
parallel = [
    "std",
    "ark-ff/parallel",
    "ark-poly/parallel",
    "ark-ec/parallel",
    "ark-crypto-primitives/parallel",
    "ark-std/parallel",
    "rayon",
]
r1cs = [
    "ark-crypto-primitives/constraints",
    "ark-r1cs-std",
    "tracing",
    "educe",
]
print-trace = ["ark-std/print-trace"]

[[bench]]
name = "groth16-benches"
path = "benches/bench.rs"
harness = false
required-features = ["std"]

[profile.release]
opt-level = 3
lto = "thin"
incremental = true
panic = 'unwind'

[profile.bench]
opt-level = 3
debug = false
rpath = false
lto = "thin"
incremental = true
debug-assertions = false

[profile.dev]
opt-level = 0
panic = 'unwind'

[profile.test]
opt-level = 3
incremental = true
debug-assertions = true
debug = true

[patch.crates-io]
ark-relations = { git = "https://github.com/arkworks-rs/snark.git" }
ark-ff = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-ec = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-poly = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-serialize = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-bls12-381 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-bls12-377 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-bn254 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-bw6-761 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-mnt4-298 = { git = "https://github.com/arkworks-rs/algebra.git" }
ark-r1cs-std = { git = "https://github.com/arkworks-rs/r1cs-std.git" }
