[workspace]
members = [
    "src/main/rust/nova-wraps",
]
resolver = "2"


[patch.crates-io]
# Use Nova WRAPS' vendored print fix and portable field arithmetic.
halo2curves = { path = "src/main/rust/nova-wraps/halo2curves" }

[profile.bench]
opt-level = 3

[profile.test]
opt-level = 3

[profile.release]
panic = "unwind"
lto = "fat"
strip = true
debug = false
opt-level = 3
codegen-units = 1
